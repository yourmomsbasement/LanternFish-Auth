# Lanternfish Gate in front of Jellyfin.
#
# The important part: Jellyfin publishes NO ports. The only way in from the
# network is through the Gate. A gate that can be routed around protects nothing.
# As a second lock, install the Lanternfish Gate Jellyfin plugin
# (jellyfin-plugin/README.md) so Jellyfin itself refuses unsigned requests.
#
# Before the first start:
#   mkdir -p secrets
#   docker run --rm lanternfish-gate gen-master-key > secrets/master_key
#   chmod 600 secrets/master_key
# Then put your TLS certificate (full chain) and key in ./certs (ignored by
# git and Docker builds; keep it that way).

services:
  gate:
    build: ..
    image: lanternfish-gate
    restart: unless-stopped
    ports:
      - "443:8443"
      # The admin dashboard (LANTERNFISH_ADMIN_LISTEN below). Don't forward
      # this port on your router; better, bind it to a LAN address only.
      - "9443:9443"
    environment:
      LANTERNFISH_UPSTREAM: http://jellyfin:8096
      LANTERNFISH_MASTER_KEY_FILE: /run/secrets/master_key
      LANTERNFISH_TLS_CERT: /certs/fullchain.pem
      LANTERNFISH_TLS_KEY: /certs/privkey.pem
      # LANTERNFISH_ALERT_WEBHOOK: https://discord.com/api/webhooks/...
      # SECURITY: narrow the admin API to the Builder's address. The default
      # allows all private ranges, and Docker's userland proxy (used, for
      # example, for IPv6 or hairpin traffic) makes outside clients appear to
      # come from the bridge gateway (172.x), which is one of them.
      # LANTERNFISH_ADMIN_ALLOW: 192.168.1.10
      # SECURITY: the dashboard on its own origin, away from Jellyfin's
      # scripts. Publish it only on an address your admin PC reaches, e.g.
      # "192.168.1.5:9443:9443" under ports.
      LANTERNFISH_ADMIN_LISTEN: ":9443"
    secrets:
      - master_key
    volumes:
      - gate-data:/data
      - ./certs:/certs:ro
    networks:
      - jellyfin

  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    # No "ports:" here, on purpose.
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /path/to/media:/media:ro
    networks:
      - jellyfin

networks:
  jellyfin:

secrets:
  master_key:
    file: ./secrets/master_key

volumes:
  gate-data:
  jellyfin-config:
  jellyfin-cache:
