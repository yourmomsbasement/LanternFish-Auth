name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard browser rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install browser test runtime
        run: |
          npm ci --prefix scripts/browser-test --ignore-scripts
          node scripts/browser-test/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Render Tickets and Email with mocked APIs
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/browser-test/node_modules
        run: node scripts/test-admin-render.cjs
      - name: Query cache upgrades (Chromium and Firefox)
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/browser-test/node_modules
        run: |
          node scripts/test-jellyfin-cache.cjs
          BROWSER=firefox node scripts/test-jellyfin-cache.cjs

  gate:
    name: Gate (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - name: go vet (linux)
        run: go vet ./...
      - name: go vet (windows)
        run: GOOS=windows go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: Toolchain pinned consistently
        run: |
          want=$(sed -n 's/^go //p' go.mod)
          got=$(go env GOVERSION)
          [ "$got" = "go$want" ] || { echo "go.mod pins go$want but CI built with $got"; exit 1; }
          grep -q "^FROM golang:$want-alpine" Dockerfile ||
            { echo "Dockerfile does not build with go$want (go.mod)"; exit 1; }
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  plugin:
    name: Jellyfin plugin (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: dotnet test
        run: dotnet test jellyfin-plugin/Jellyfin.Plugin.LanternfishGate.sln -c Release

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck
        run: shellcheck deploy/systemd/*.sh deploy/systemd/lanternfish-gatectl deploy/proxmox/verify.sh deploy/proxmox/guarded-firewall*.sh
      - name: Guarded firewall tests (mock host commands)
        run: bash deploy/proxmox/guarded-firewall_test.sh
      - name: Recovery encryption dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y age
      - name: Encrypted backup and isolated recovery tests
        run: python3 -m unittest discover -s deploy/systemd -p 'test_lanternfish_recovery.py' -v
      - name: systemd unit
        run: |
          sudo touch /usr/local/bin/lanternfish-gate && sudo chmod +x /usr/local/bin/lanternfish-gate
          systemd-analyze verify deploy/systemd/lanternfish-gate.service
