name: Release

# Push a tag like v0.1.0 (or v0.2.0-rc1 for a pre-release) to publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  gate:
    name: Gate ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="lanternfish-gate_${version}_${GOOS}_${GOARCH}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p "dist/$name/docs"
          go build -trimpath -ldflags "-s -w -X main.version=$version" \
            -o "dist/$name/lanternfish-gate$ext" ./cmd/lanternfish-gate
          cp README.md "dist/$name/"
          cp docs/PROTOCOL.md "dist/$name/docs/"
          cp -r deploy "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
          rm -r "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  plugin:
    name: Jellyfin plugin
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and package
        run: |
          version="${GITHUB_REF_NAME#v}"
          numeric="${version%%-*}"
          case "$numeric" in
            *.*.*.*) asm="$numeric" ;;
            *.*.*)   asm="$numeric.0" ;;
            *) echo "tag must look like v1.2.3" >&2; exit 1 ;;
          esac
          dotnet publish jellyfin-plugin/Jellyfin.Plugin.LanternfishGate -c Release -o out \
            -p:Version="$numeric" -p:AssemblyVersion="$asm" -p:FileVersion="$asm"
          folder="LanternfishGate_$asm"
          mkdir -p "dist/$folder"
          cp out/Jellyfin.Plugin.LanternfishGate.dll "dist/$folder/"
          jq --arg v "$asm" --arg t "$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)" \
            '.version = $v | .timestamp = $t' out/meta.json > "dist/$folder/meta.json"
          cd dist
          zip -qr "jellyfin-plugin-lanternfish-gate_${version}.zip" "$folder"
          rm -r "$folder"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [gate, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<NOTES
          ## Downloads

          | File | What it is |
          |---|---|
          | \`lanternfish-gate_${version}_linux_amd64.tar.gz\` | Gate for Linux x86-64 (Proxmox LXC), with \`deploy/\` scripts and docs |
          | \`lanternfish-gate_${version}_linux_arm64.tar.gz\` | Gate for Linux ARM64 (Raspberry Pi 4/5 and similar) |
          | \`lanternfish-gate_${version}_windows_amd64.zip\` | Gate for Windows |
          | \`jellyfin-plugin-lanternfish-gate_${version}.zip\` | Jellyfin 12.2+ plugin: unzip into Jellyfin's \`plugins/\` folder |
          | \`SHA256SUMS\` | Checksums (\`sha256sum -c SHA256SUMS\`) |

          Setup on Proxmox: \`deploy/proxmox/README.md\` inside the Gate archive.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Lanternfish $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
