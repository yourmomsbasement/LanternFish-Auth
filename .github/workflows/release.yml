name: Release

# Either push a tag like v0.1.0 (v0.2.0-rc1 for a pre-release), or publish a
# release with a v* tag on GitHub; this builds the files and attaches them.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  gate:
    name: Gate ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="lanternfish-gate_${version}_${GOOS}_${GOARCH}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p "dist/$name/docs"
          # Keep symbols in the shipped binary: govulncheck falls back to all
          # vulnerable packages in each module when symbols are stripped,
          # including packages we do not import (such as x/crypto/openpgp).
          go build -trimpath -ldflags "-X main.version=$version" \
            -o "dist/$name/lanternfish-gate$ext" ./cmd/lanternfish-gate
          # The runtime is compiled into the binary, so check which one it got:
          # exactly the Go release go.mod pins.
          want="go$(sed -n 's/^go //p' go.mod)"
          got=$(go version "dist/$name/lanternfish-gate$ext" | awk '{print $2}')
          [ "$got" = "$want" ] || { echo "built with $got, want $want"; exit 1; }
          # (govulncheck itself runs here, so not cross-compiled.)
          env -u GOOS -u GOARCH go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "dist/$name/lanternfish-gate$ext"
          cp README.md "dist/$name/"
          cp docs/PROTOCOL.md "dist/$name/docs/"
          cp -r deploy "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
          rm -r "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  plugin:
    name: Jellyfin plugin
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and package
        run: |
          version="${GITHUB_REF_NAME#v}"
          numeric="${version%%-*}"
          case "$numeric" in
            *.*.*.*) asm="$numeric" ;;
            *.*.*)   asm="$numeric.0" ;;
            *) echo "tag must look like v1.2.3" >&2; exit 1 ;;
          esac
          dotnet publish jellyfin-plugin/Jellyfin.Plugin.LanternfishGate -c Release -o out \
            -p:Version="$numeric" -p:AssemblyVersion="$asm" -p:FileVersion="$asm"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)"
          mkdir -p dist pkg
          cp out/Jellyfin.Plugin.LanternfishGate.dll pkg/
          jq --arg v "$asm" --arg t "$timestamp" '.version = $v | .timestamp = $t' out/meta.json > pkg/meta.json

          # Flat zip: Jellyfin extracts it straight into plugins/<Name>_<version>/.
          zip_name="jellyfin-plugin-lanternfish-gate_${version}.zip"
          (cd pkg && zip -qX "../dist/$zip_name" Jellyfin.Plugin.LanternfishGate.dll meta.json)

          # Plugin repository manifest, so Jellyfin can install and update the
          # plugin itself (Dashboard -> Plugins -> Repositories).
          md5=$(md5sum "dist/$zip_name" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${zip_name}"
          notes="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          jq -n --slurpfile m pkg/meta.json --arg v "$asm" --arg url "$url" --arg md5 "$md5" \
            --arg t "$timestamp" --arg notes "See $notes" '[{
              guid: $m[0].guid, name: $m[0].name, description: $m[0].description,
              overview: $m[0].overview, owner: $m[0].owner, category: $m[0].category,
              imageUrl: "",
              versions: [{
                version: $v, changelog: $notes, targetAbi: $m[0].targetAbi,
                sourceUrl: $url, checksum: $md5, timestamp: $t
              }]
            }]' > dist/manifest.json
          ls -l dist
          cat dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [gate, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release manifest (signed offline afterwards; see docs/RELEASES.md)
        run: |
          bash scripts/release-manifest.sh "$GITHUB_REF_NAME" dist > lanternfish-release.json
          mv lanternfish-release.json dist/
          cat dist/lanternfish-release.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<NOTES
          ## Downloads

          | File | What it is |
          |---|---|
          | \`lanternfish-gate_${version}_linux_amd64.tar.gz\` | Gate for Linux x86-64 (Proxmox LXC), with \`deploy/\` scripts and docs |
          | \`lanternfish-gate_${version}_linux_arm64.tar.gz\` | Gate for Linux ARM64 (Raspberry Pi 4/5 and similar) |
          | \`lanternfish-gate_${version}_windows_amd64.zip\` | Gate for Windows |
          | \`jellyfin-plugin-lanternfish-gate_${version}.zip\` | Jellyfin 12.2+ plugin: unzip into \`plugins/LanternfishGate_${version}/\` |
          | \`manifest.json\` | Jellyfin plugin repository manifest |
          | \`SHA256SUMS\` | Checksums (\`sha256sum -c SHA256SUMS\`) |
          | \`lanternfish-release.json\` | Release manifest: every file's SHA-256, for the updater |
          | \`lanternfish-release.json.sig\` | The manifest's signature, added by the maintainer after checking the files. Gates update only to signed releases. |

          Setup on Proxmox: \`deploy/proxmox/README.md\` inside the Gate archive.

          **Install or update the plugin from inside Jellyfin:** Dashboard → Plugins → Repositories → add
          \`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json\`
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release made on GitHub (or a re-run): attach the files to it.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Lanternfish $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
          fi
